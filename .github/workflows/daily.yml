name: Daily Content Update

on:
  schedule:
    # 每天 8:00 KST（= UTC 23:00）
    - cron: '0 23 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许 push 回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate content
        working-directory: pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python pipeline.py --category tech --count 1
          python pipeline.py --category travel --count 1
          python pipeline.py --category direct --count 1
          python fetch_images.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "auto: daily content update ($(date -u +%Y-%m-%d))"
            git push
          fi
